<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Orientación</title>
<style>
:root{--vino:#4E0F22;--borgona:#7A1F3D;--hueso:#F8F2F3;--suave:#7C6168;--tinta:#2B1219}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:linear-gradient(160deg,var(--vino) 0 42%,var(--hueso) 42%)}
form{background:#fff;width:min(380px,92vw);padding:34px 30px;border-radius:12px;box-shadow:0 18px 50px rgba(43,18,25,.3)}
h1{font:700 24px/1.2 Georgia,"Times New Roman",serif;color:var(--vino);margin:0 0 4px}
p{margin:0 0 22px;color:var(--suave)}
label{display:block;font-size:13px;font-weight:600;color:var(--suave);margin:14px 0 4px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid #CDB3BA;border-radius:6px}
input:focus{outline:3px solid rgba(122,31,61,.25);border-color:var(--borgona)}
button{margin-top:22px;width:100%;background:var(--borgona);color:#fff;border:0;padding:12px;border-radius:6px;font:600 15px inherit;font-family:inherit;cursor:pointer}
button:hover{background:var(--vino)}
.error{margin-top:16px;padding:10px 12px;background:#F4E4E8;border-left:4px solid var(--borgona);border-radius:4px;font-size:14px}
</style>
</head>
<body>
<form method="post">
  <h1>Departamento de Orientación</h1>
  <p>Inicia sesión para ver y registrar canalizaciones.</p>
  <label for="usuario">Usuario</label>
  <input id="usuario" name="usuario" autocomplete="username" autofocus required>
  <label for="clave">Contraseña</label>
  <input id="clave" name="clave" type="password" autocomplete="current-password" required>
  <button type="submit">Entrar</button>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
</form>
</body>
</html>
